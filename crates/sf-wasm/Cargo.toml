[package]
name = "sf-wasm"
description = "WebAssembly bindings that expose sf-core to the browser."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sf-core = { path = "../sf-core" }
wasm-bindgen = "=0.2.130"
serde_json = "1"
