[package]
name = "sf-core"
description = "Sunday Football simulation core: rules, on-field sim, AI, franchise. No graphics."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
rapier3d = { version = "0.36", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"] }
