[workspace]
resolver = "2"
members = ["crates/sf-core", "crates/sf-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Smaller WebAssembly for the browser (the PC build keeps the speed-optimized profile).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
